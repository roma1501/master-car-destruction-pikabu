<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мастер аварий: разбей машину</title>
    <link rel="icon" type="image/svg+xml" href="assets/branding/mcd-logo.svg">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14161a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        @font-face { font-family: 'Rubik MCD'; font-weight: 500 900; font-style: normal; font-display: swap; src: url('assets/fonts/rubik-mcd.woff?v=0.1.2-aa56a335') format('woff'); }
        /* Экран загрузки: лаборатория краш-тестов — жёлто-чёрные полосы, мишень-четвертинка, сегментный индикатор стенда */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            overflow: hidden;
            background:
                radial-gradient(ellipse 34% 20% at 84% 88%, rgba(0,0,0,.55), transparent 72%),
                radial-gradient(ellipse 22% 30% at 12% 14%, rgba(0,0,0,.4), transparent 70%),
                repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,196,0,.05) 46px 48px),
                radial-gradient(ellipse 62% 52% at 50% 46%, #29241a, #0c0b08 78%);
            z-index: 1000;
            font-family: 'Rubik MCD', 'Arial Narrow', Arial, sans-serif;
            color: #ece6d2;
        }
        #loading-screen::before, #loading-screen::after { content: ''; position: absolute; left: 0; right: 0; height: 16px; background: repeating-linear-gradient(-45deg, #ffc400 0 18px, #0c0b08 18px 36px); animation: mcd-haz 1.1s steps(8) infinite; }
        #loading-screen::before { top: 0; }
        #loading-screen::after { bottom: 0; animation-direction: reverse; }
        @keyframes mcd-haz { to { background-position: 50.9px 0; } }
        .loading-text {
            font: 700 14px 'Rubik MCD', sans-serif;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: #a79f85;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(380px, 78vw);
            height: 18px;
            background: #1d1a13;
            -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
            mask-image: repeating-linear-gradient(90deg, #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: #ffc400;
            transition: width 0.3s steps(6);
        }
        #loading-title { margin: 0; font: 900 clamp(28px, 6.6vw, 66px)/1 'Rubik MCD', Arial, sans-serif; color: #ece6d2; text-align: center; max-width: 90vw; text-transform: uppercase; letter-spacing: .06em; text-shadow: 0 5px 0 #000; text-wrap: balance; -webkit-mask-image: linear-gradient(180deg, #000 0 47%, transparent 47% 52%, #000 52% 100%); mask-image: linear-gradient(180deg, #000 0 47%, transparent 47% 52%, #000 52% 100%); }
        .stm-emblem { width: clamp(84px, 17vh, 156px); height: clamp(84px, 17vh, 156px); object-fit: contain; filter: drop-shadow(0 7px 0 rgba(0,0,0,.6)); animation: mcd-thud 4.4s infinite; }
        @keyframes mcd-thud {
            0%, 20% { transform: rotate(0) scale(1); }
            24% { transform: rotate(45deg) scale(.86); }
            28% { transform: rotate(90deg) scale(1.12); }
            31%, 45% { transform: rotate(90deg) scale(1); }
            49% { transform: rotate(135deg) scale(.86); }
            53% { transform: rotate(180deg) scale(1.12); }
            56%, 70% { transform: rotate(180deg) scale(1); }
            74% { transform: rotate(225deg) scale(.86); }
            78% { transform: rotate(270deg) scale(1.12); }
            81%, 93% { transform: rotate(270deg) scale(1); }
            96% { transform: rotate(315deg) scale(.86); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .engine-mark { position: absolute; right: 16px; bottom: 30px; width: 40px; height: 40px; object-fit: contain; opacity: .55; }
        #loading-percent { font: 900 30px 'Rubik MCD', sans-serif; color: #ffc400; font-feature-settings: 'tnum' 1; text-shadow: 0 3px 0 #000; }
        #loading-retry { padding: 12px 34px; border: 0; background: #ffc400; color: #17140d; font: 900 18px 'Rubik MCD', sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; border-radius: 3px; box-shadow: inset 0 -4px 0 #d99e00, 0 4px 0 #000; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <img class="stm-emblem" src="assets/branding/mcd-logo.svg" alt="" aria-hidden="true">
        <h1 id="loading-title" data-t="title">Мастер аварий: разбей машину</h1>
        <img class="engine-mark" src="assets/branding/lory-engine.png" alt="" aria-hidden="true">
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->

<script src="js/Constants.js?v=0.1.2-aa56a335"></script>

    <script src="js/Quality.js?v=0.1.2-aa56a335"></script>

    <script src="js/Shop.js?v=0.1.2-aa56a335"></script>

    <script src="js/main.js?v=0.1.2-aa56a335"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
